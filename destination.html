        <h2>Visit our Top Destination</h2>
        <div class="destinations">
            <figure>
                <img src="images/parkisalo.jpg" alt="Isalo National Park" loading="lazy">
                <figcaption>
                    <h3>Park Isalo, Ihorombe</h3>
                    <p>Known for its sandstone formations, canyons, and natural swimming pools.</p>

                </figcaption>
            </figure>

            <figure>
                <img src="images/baobabsavenue.jpg" alt="Baobabs Avenue" loading="lazy">
                <figcaption>
                    <h3>Avenue of the Baobabs Morondava</h3>
                    <p>One of Madagascar's most famous landmarks near Morondava.</p>

                </figcaption>
            </figure>

            <figure>
                <img src="images/lemurspark.jpg" alt="Lemur's Park" loading="lazy">
                <figcaption>
                    <h3>Lemurs' Park Andasibe</h3>
                    <p>One of the best places to see the Indri, the largest living lemur.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="images/nosysakatia.jpg" alt="Sakatia Island" loading="lazy">
                <figcaption>
                    <h3>Nosy Sakatia Island Nosy Be</h3>
                    <p>Nosy Sakatia is a small island near Nosy Be, famous for its crystal-clear waters, white sandy
                        beaches, and rich marine
                        life.</p>

                </figcaption>
            </figure>

            <figure>
                <img src="images/tsingyrouge.jpg" alt="Red Tsingy Park" loading="lazy">
                <figcaption>
                    <h3>Red Tsingy Park Antsiranana</h3>
                    <P>
                        Unique red rock formations created by erosion.
                    </P>

                </figcaption>
            </figure>

            <figure>
                <img src="images/nosyiranja.jpg" alt="Iranja Island" loading="lazy">
                <figcaption>
                    <h3>Nosy Iranja Nosy Be</h3>
                    <p>
                        A stunning island connected by a white sandbar at low tide.
                    </p>
                </figcaption>
            </figure>

            <figure>
                <img src="images/makaymassif.jpg" alt="The Makay Massif" loading="lazy">
                <figcaption>
                    <h3>The Makay Massif: range of mountain in western Madagascar</h3>
                    <p>The Makay Massif is a remote mountain range located in western Madagascar. Known for its deep
                        canyons, unique wildlife,
                        and untouched landscapes.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="images/tritrivalake.jpg" alt="Lake Tritriva" loading="lazy">
                <figcaption>
                    <h3>Lake Tritriva Antsirabe</h3>
                    <p>Lake Tritriva is a beautiful volcanic crater lake. It is known for its deep blue waters,
                        mysterious legends, and breathtaking scenery surrounded by rocky cliffs.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="images/lilywaterfall.jpg" alt="Lily waterfall" loading="lazy">
                <figcaption>
                    <h3>Lily Waterfall Ampefy</h3>
                    <p>Lily Waterfall is one of the most famous waterfalls in Madagascar, visitors enjoy its impressive
                        cascade, lush green surroundings, and peaceful atmosphere.</p>

                </figcaption>
            </figure>

            <figure>
                <img src="images/geyserampefy.jpg" alt="Geyser Amparaky" loading="lazy">
                <figcaption>
                    <h3>Geyser Amparaky</h3>
                    <p>The Amparaky Geyser is a fascinating natural attraction where hot mineral-rich water rises from
                        underground
                        and sprays into the air.</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/itampolobeach.jpg" alt="Itampolo Toliara" loading="lazy">
                <figcaption>
                    <h3>Beach Itampolo</h3>
                    <p>Itampolo beach is a remote, untouched coastal paradise famous for its endless white sand dunes,
                        crystal-clear turquoise waters</p>
                </figcaption>
            </figure>
            <figure>
                <img src="images/whale.jpg" alt="Boss Whale" loading="lazy">
                <figcaption>
                    <h3>Whale Festival</h3>
                    <p>The Festival des Baleines (Whale Festival) in Madagascar is an annual, week-long celebration held
                        on Île Sainte-Marie
                        (Nosy Boraha)</p>
                </figcaption>
            </figure>
