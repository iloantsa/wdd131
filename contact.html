<body>
    <header>
        <h1>Contact Us</h1>

        <button id="hambutton">☰</button>
        <nav>
            <ul class="navigation">
                <li><a href="finalproject.html">Home</a></li>
                <li><a href="destination.html">Destination</a></li>
                <li><a href="contact.html" class="active">Contact us </a></li>

            </ul>


        </nav>


    </header>


    <main>
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <fieldset>
                <legend>Choose a destination</legend>

                <div id="destination-options"></div>
            </fieldset>
            <label for="travelers">Number of Travelers</label>
            <input type="number" id="travelers" name="travelers" min="1">

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <p>
                Please complete the form below to request information about your trip to Madagascar.
            </p>

            <button type="submit">Send</button>
        </form>

    </main>
