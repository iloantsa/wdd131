<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="WDD 131, product review practice html, javascript and css  week05 assignment">
    <meta name="author" content="RAVAOARINIAINA">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sansita:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select name="product" id="product" required>

                <option value="" disabled selected>Select a Product</option>
            </select>
            <label>Overall Rating</label>
            <div class="stars">
                <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
            </div>    
            <fieldset>


                <legend>Which features did you find useful in the product?(Check all that apply) </legend>
                
                <input type="checkbox" id="durability" name="features[]" value="Durability">
                Durability
                <input type="checkbox" id="use" name="features[]" value="Ease of Use">
                Ease of Use
                <input type="checkbox" id="perf" name="features[]" value="Performance">
                Performance
                <input type="checkbox" id="design" name="features[]" value="Design">
                Design
            </fieldset>    
            
        
            <label for="date">Date of Installation</label>
            <input type="date">

            <fieldset>
                <legend>Written Review (optional)</legend>
                <textarea id="feedback" name="feedback" rows="4"></textarea>
            </fieldset>
        
           
        
            <label for="username">User Name:(optional)</label></label>
            <input type="text" id="username" name="username">
        
            <button type="submit">Post Review</button>
        
        
        
        </form>
    </main>
    
    <footer>

        <p>© 2026, <span id="currentYear"></span> RAVAOARINIAINA, Madagascar🏡 </p>
        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
